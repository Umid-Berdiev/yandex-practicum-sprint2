name: API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run tests against"
        required: true
        default: "docker"
        type: choice
        options:
          - local
          - docker
      test_folder:
        description: "Test folder to run (leave empty for all)"
        required: false
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Compose
        run: docker compose --version

      - name: Create .env file
        run: cp .env.example .env

      - name: Start services with Docker Compose
        run: |
          docker compose up -d --build
          echo "Waiting for Kafka healthcheck to pass..."
          sleep 60

      - name: Check all containers are running
        run: docker compose ps

      - name: Build test Docker image
        working-directory: tests/postman
        run: docker build -t cinemaabyss-api-tests .

      - name: Run API tests
        run: |
          docker run --rm \
            --network cinemaabyss-network \
            -v "$(pwd)/tests/postman/reports:/app/reports" \
            cinemaabyss-api-tests --environment docker

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: tests/postman/reports/

      - name: Stop services
        if: always()
        run: docker compose down -v
